name: TaskFlow API CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
      - "feature/skenario-*"
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  # ── STAGE 1: CI (Testing & Analysis) ───────────────────────────────────────
  test:
    name: Test with Go v${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go v${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Integration & Unit Tests (Race Detector)
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: |
          go test -tags=integration -race -coverprofile=cov.out ./...

      - name: Check Code Coverage Threshold (Min 75%)
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=cov.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total Project Coverage: $TOTAL_COVERAGE%"
          if (( $(echo "$TOTAL_COVERAGE < 75.0" | bc -l) )); then
            echo "❌ ERROR: Coverage ($TOTAL_COVERAGE%) di bawah ambang batas 75%!"
            exit 1
          fi

      - name: Compile Binary (Go Build)
        run: go build -o taskflow-api ./cmd/server/main.go

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-go-${{ matrix.go-version }}
          path: cov.out
          retention-days: 7

  # ── STAGE 2: CD (Build, Push & Smoke Test) ──────────────────────────────────
  build-and-push:
    name: Build, Push, and Smoke Test
    needs: test
    runs-on: ubuntu-latest
    # Jalankan CD hanya pada push ke branch utama, bukan pada Pull Request
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:latest

      # ── SKENARIO 4: SMOKE TEST ─────────────────────────────────────────────
      - name: Run Smoke Test
        run: |
          # Jalankan container secara temporer untuk testing
          docker run -d --name smoke-test -p 8080:8080 ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}
          echo "Waiting for server to be ready..."
          sleep 5

          echo "Checking Health Endpoint..."
          curl -f http://localhost:8080/health || (docker logs smoke-test && exit 1)

          echo "Checking Stats Endpoint..."
          curl -f http://localhost:8080/api/v1/stats || (docker logs smoke-test && exit 1)

          echo "✅ Smoke test sukses!"
          docker rm -f smoke-test

      # ── SKENARIO 4: NOTIFIKASI TELEGRAM ────────────────────────────────────
      - name: Notify Telegram Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ *Deployment Stable - Siap Demo!*

            *Repo:* ${{ github.repository }}
            *Branch:* `${{ github.ref_name }}`
            *SHA:* `${{ steps.vars.outputs.sha_short }}`
            *Status:* Smoke Test Lulus 🚀

            [Lihat Detail Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id patch }})

      - name: Notify Telegram Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *Deployment Crash - Emergency!*

            *Repo:* ${{ github.repository }}
            *Branch:* `${{ github.ref_name }}`
            *SHA:* `${{ steps.vars.outputs.sha_short }}`
            *Status:* Smoke Test Gagal! ⚠️

            [Cek Log Error Sekarang](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
