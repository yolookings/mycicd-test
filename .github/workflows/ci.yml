name: TaskFlow API CI/CD Pipeline

env:
  FORCE_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  DB_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable

on:
  push:
    branches:
      - main
      - staging
      - dev
      - "feature/skenario-*"
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  # ── CI STAGE: Validasi & Testing ────────────────────────────────────────────
  test:
    name: Test with Go v${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go v${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: ${{ matrix.go-version != '1.21' }}

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet
        run: make vet

      - name: Run Integration & Unit Tests
        run: make test-integration

      - name: Check Code Coverage Threshold
        run: |
          make test-cover
          TOTAL_COVERAGE=$(grep total coverage.out | awk '{print $3}' | sed 's/%//')
          echo "Total Project Coverage: $TOTAL_COVERAGE%"
          if (( $(echo "$TOTAL_COVERAGE < 75.0" | bc -l) )); then
            echo "❌ ERROR: Coverage ($TOTAL_COVERAGE%) di bawah 75%!"
            exit 1
          fi

      - name: Compile Binary
        run: make build

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-go-${{ matrix.go-version }}
          path: coverage.out
          retention-days: 7

  # ── SECSTAGE: Audit Keamanan ISO 27001 (Kategori A & B) ──────────────────────
  security-audit:
    name: Security Vulnerability & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # KATEGORI A — SCA: Dependency Vulnerability Check
      - name: Run SCA (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Export SCA Report to JSON
        if: always()
        run: |
          govulncheck -json ./... > ssa-vuln-report.json || true

      # KATEGORI B — SAST: Analisis Keamanan Kode Sumber
      - name: Run SAST (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt json -out gosec-report.json ./...

      # UPLOAD ARTIFACT: Menyimpan laporan untuk Tim Auditor ISO
      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: |
            ssa-vuln-report.json
            gosec-report.json
          retention-days: 7

  # ── CD STAGE: Build, Tagging SHA & Stable, Smoke Test ───────────────────────
  build-and-push:
    name: Build, Push, and Smoke Test
    needs: [test, security-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write

    # Menghubungkan output variabel ke job deploy di bawahnya
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Short SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # ── TAMBAHKAN BARIS INI ──────────────────────────────────────────
          # Ini akan menyuruh GitHub membuat dua biner sekaligus di dalam satu image tag!
          platforms: linux/amd64, linux/arm64
          # ─────────────────────────────────────────────────────────────────
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Test
        run: |
          docker run -d --name smoke-test -p 8080:8080 ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}
          echo "Waiting for server to be ready..."
          sleep 5
          curl -f http://localhost:8080/health || (docker logs smoke-test && exit 1)
          curl -f http://localhost:8080/api/v1/stats || (docker logs smoke-test && exit 1)
          echo "✅ Smoke test berhasil"
          docker rm -f smoke-test

      - name: Pull image before tagging
        run: docker pull ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}

      - name: Tag and Push Image as Stable
        run: |
          make docker-stable VERSION=${{ steps.vars.outputs.sha_short }} REGISTRY=${{ env.REGISTRY }} IMAGE=${{ steps.vars.outputs.image_name }}

      - name: Notify Telegram Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ *Deployment Stable - Siap Demo!*

            *Repo:* ${{ github.repository }}
            *Branch:* `${{ github.ref_name }}`
            *SHA:* `${{ steps.vars.outputs.sha_short }}`
            *Status:* Smoke Test Lulus & Tag :stable Diperbarui! 🚀

            [Lihat Detail Pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *Deployment Crash - Emergency!*

            *Repo:* ${{ github.repository }}
            *Branch:* `${{ github.ref_name }}`
            *SHA:* `${{ steps.vars.outputs.sha_short }}`
            *Status:* Smoke Test / Security Audit Gagal (Tag :stable Ditahan) ⚠️

            [Cek Log Error Sekarang](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ── K8S STAGE: Otomatis CD ke Cluster Kubernetes ────────────────────────────
  deploy:
    name: Deploy ke Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' # Hanya auto-deploy jika push dilakukan ke branch main

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Konfigurasi kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image di Deployment
        run: |
          IMAGE="ghcr.io/${{ needs.build-and-push.outputs.image_name }}:sha-${{ needs.build-and-push.outputs.sha_short }}"
          echo "→ Deploy image: $IMAGE"

          kubectl set image deployment/taskflow-api \
            taskflow-api=$IMAGE \
            -n taskflow-prod

      - name: Tunggu rollout selesai
        run: |
          kubectl rollout status deployment/taskflow-api \
            -n taskflow-prod \
            --timeout=120s

      - name: Verifikasi deployment
        run: |
          echo "→ Status Pod setelah deploy:"
          kubectl get pods -n taskflow-prod
          echo "→ Image yang berjalan:"
          kubectl get deployment taskflow-api -n taskflow-prod \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          echo "✅ Deploy berhasil!"
