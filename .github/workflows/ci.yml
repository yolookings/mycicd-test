name: TaskFlow API CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
      - "feature/skenario-*"
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  test:
    name: Test with Go v${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go v${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Integration & Unit Tests
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: |
          go test -tags=integration -race -coverprofile=cov.out ./...

      - name: Check Code Coverage Threshold
        run: |
          TOTAL_COVERAGE=$(go tool cover -func=cov.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total Project Coverage: $TOTAL_COVERAGE%"
          if (( $(echo "$TOTAL_COVERAGE < 75.0" | bc -l) )); then
            echo "❌ ERROR: Coverage ($TOTAL_COVERAGE%) di bawah 75%!"
            exit 1
          fi

      - name: Compile Binary
        run: go build -o taskflow-api ./cmd/server/main.go

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-go-${{ matrix.go-version }}
          path: cov.out
          retention-days: 7

  # ── NEW: Stage CD (Hanya jalan setelah test sukses) ─────────────────────────
  build-and-push:
    name: Build & Push Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    # CD hanya dipicu oleh push ke branch utama (bukan Pull Request)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mengambil 7 karakter SHA untuk tagging sesuai Skenario 3
      - name: Get Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Format Tag: ghcr.io/username/repo:sha-abcdefg
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:latest
