name: TaskFlow API CI Pipeline

on:
  push:
    branches:
      - main
      - staging
      - dev
      - "feature/skenario-*"
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  test:
    name: Test with Go v${{ matrix.go-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go v${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install Dependencies
        run: go mod download

      # 1. KRITERIA: Jalankan go vet (Analisis Statis)
      - name: Run Go Vet
        run: go vet ./...

      # 2. KRITERIA: Jalankan Unit Test & Integration Test dengan Race Detector
      - name: Run Integration & Unit Tests with Race Detector
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: |
          go test -tags=integration -race -coverprofile=cov.out ./...

      # 3. KRITERIA: Verifikasi & Gagal Otomatis jika Coverage < 75%
      - name: Check Code Coverage Threshold
        run: |
          go tool cover -func=cov.out

          # Mengambil angka total percentage dari output go tool cover menggunakan awk
          TOTAL_COVERAGE=$(go tool cover -func=cov.out | grep total | awk '{print $3}' | sed 's/%//')

          echo "Total Project Coverage: $TOTAL_COVERAGE%"

          # Melakukan komparasi ekspresi matematika float menggunakan bc
          if (( $(echo "$TOTAL_COVERAGE < 75.0" | bc -l) )); then
            echo "❌ ERROR: Code coverage ($TOTAL_COVERAGE%) berada di bawah batas minimum 75%!"
            exit 1
          fi
          echo "✅ SUCCESS: Code coverage memenuhi syarat (> 75%)"

      # 4. KRITERIA: Kompilasi Binary (Gagal jika go build tidak berhasil)
      - name: Compile Binary (Go Build)
        run: go build -o taskflow-api ./cmd/server/main.go

      # 5. KRITERIA: Simpan Laporan Coverage Sebagai Artifact Pipeline
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-go-${{ matrix.go-version }}
          path: cov.out
          retention-days: 7 # Laporan akan otomatis dihapus setelah 7 hari agar hemat storage
